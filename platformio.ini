[platformio]
default_envs = ledcon_hw

# ── Gledopto Elite 2D-EXMU (ESP32-PoE, LAN8720 ETH) ────────────────────────
[env:ledcon_hw]
platform = espressif32
board = esp32-poe
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
  makuna/NeoPixelBus @ ^2.7
  me-no-dev/AsyncTCP @ ^1.1
  mathieucarbou/ESP Async WebServer @ ^3
  bblanchon/ArduinoJson @ ^7
  miq19/eModbus
build_flags =
  -D LED_DATA_PIN=16
  -D LED_MAX_SEGS=8
  -D LED_MAX_COUNT=300
  -D LED_DEFAULT_COUNT=50
  -D MODBUS_PORT=502
  -D LEDCON_VERSION=\"2.0.0\"
  -D USE_ETH=1
  -D ETH_PHY_ADDR=1
  -D ETH_PHY_MDC=23
  -D ETH_PHY_MDIO=33
  -D ETH_PHY_POWER=5
  -D ETH_CLK_MODE=ETH_CLOCK_GPIO0_IN
  -D CONFIG_ASYNC_TCP_RUNNING_CORE=1
  -DARDUINO_USB_CDC_ON_BOOT=0
board_build.filesystem = littlefs
board_build.partitions = default.csv
board_build.flash_mode = dio
